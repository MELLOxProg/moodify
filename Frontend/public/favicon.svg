<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Background gradient: blue -> purple -> coral -> orange -->
    <linearGradient id="bgGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B6FE0"/>
      <stop offset="30%" stop-color="#7A5FC7"/>
      <stop offset="60%" stop-color="#E8637A"/>
      <stop offset="100%" stop-color="#F5B940"/>
    </linearGradient>

    <!-- Soft glow blobs -->
    <radialGradient id="glowOrange" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD37A" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFD37A" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5B8CFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#5B8CFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass icon fill -->
    <linearGradient id="glassFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#D9F2EA" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Top highlight stroke -->
    <linearGradient id="edgeHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <filter id="iconShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1a1a2e" flood-opacity="0.25"/>
    </filter>

    <clipPath id="tileClip">
      <rect x="20" y="20" width="472" height="472" rx="104" ry="104"/>
    </clipPath>

  </defs>

  <!-- Rounded square tile -->
  <g clip-path="url(#tileClip)">
    <rect x="20" y="20" width="472" height="472" fill="url(#bgGrad)"/>
    <circle cx="150" cy="150" r="150" fill="url(#glowBlue)" filter="url(#softBlur)"/>
    <circle cx="380" cy="120" r="160" fill="url(#glowOrange)" filter="url(#softBlur)"/>
    <circle cx="350" cy="380" r="140" fill="url(#glowOrange)" filter="url(#softBlur)" opacity="0.6"/>
  </g>

  <!-- Outer tile border -->
  <rect
    x="20"
    y="20"
    width="472"
    height="472"
    rx="104"
    ry="104"
    fill="none"
    stroke="#FFFFFF"
    stroke-opacity="0.15"
    stroke-width="2"
  />

  <!-- Glass icon -->
  <g filter="url(#iconShadow)">

    <!-- Smile arc -->
    <path
      d="M150 280
         Q150 380 256 380
         Q362 380 362 280"
      fill="none"
      stroke="url(#glassFill)"
      stroke-width="26"
      stroke-linecap="round"
    />

    <!-- Left hook -->
    <path
      d="M150 280
         L150 220
         Q150 195 175 195
         L195 195"
      fill="none"
      stroke="url(#glassFill)"
      stroke-width="26"
      stroke-linecap="round"
    />

    <!-- Right hook -->
    <path
      d="M362 280
         L362 220
         Q362 195 337 195
         L317 195"
      fill="none"
      stroke="url(#glassFill)"
      stroke-width="26"
      stroke-linecap="round"
    />

    <!-- Equalizer bars -->
    <rect x="203" y="230" width="26" height="130" rx="13" fill="url(#glassFill)"/>
    <rect x="243" y="170" width="26" height="190" rx="13" fill="url(#glassFill)"/>
    <rect x="283" y="150" width="26" height="210" rx="13" fill="url(#glassFill)"/>

    <!-- Glass highlight -->
    <path
      d="M150 280
         Q150 380 256 380
         Q362 380 362 280"
      fill="none"
      stroke="url(#edgeHighlight)"
      stroke-width="4"
      stroke-linecap="round"
      opacity="0.6"
    />

  </g>

</svg>